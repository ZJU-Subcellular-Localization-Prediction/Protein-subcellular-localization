# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/protein_localization?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Python inference
predict.python.path=python
predict.python.script=python/predict.py
predict.python.timeout-seconds=60
predict.model.path=python/best_model.pt
predict.manifest.path=python/data/features/manifest.pt

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
